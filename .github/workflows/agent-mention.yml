name: Agent · Mention

# Routes an @claude mention on an issue or PR here to the right specialist.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  route:
    # Only act on a real mention, and never on the bot's own comments — that
    # loop is cheap to start and expensive to notice.
    if: >-
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Is an investigator configured?
        id: investigator
        uses: ./.github/actions/investigator
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - id: route
        if: steps.investigator.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Prefer the Claude subscription token when it is set: on a Max plan
          # these runs cost nothing, where an API key bills per token. The
          # action gives the API key precedence when BOTH are present, so the
          # key is deliberately blanked when a subscription token exists.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Answer the @claude request in this issue or PR.

            Route it to the right specialist rather than answering generically:
              money or ROI questions   → the `spend-auditor` subagent
              portfolio or "how are we doing" → the `portfolio-analyst` subagent
              clients, deals, follow-ups → the `pipeline-nudge` subagent
              "is the dashboard alive"  → the `heartbeat-watchdog` subagent
              anything about one project's blockers → the `gate-check` workflow

            Read CLAUDE.md before making any change. The rules there about pence,
            about never writing to Stripe, and about not inventing numbers are
            load-bearing.
          claude_args: |
            --allowed-tools Read,Write,Edit,Bash,Grep,Glob,WebFetch,Agent,Workflow
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Say so on the thread when nothing can answer
        # Unlike the scheduled agents, there is a person waiting here. A red run
        # in the Actions tab is not an answer they will ever see, so the fact
        # that nobody is coming goes back on the thread they asked in.
        if: always() && steps.investigator.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set +e
          echo "::warning title=Mention unanswered::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, so the @claude mention was not routed to anybody."
          [ -z "$ISSUE_NUMBER" ] && exit 0
          BODY='No `CLAUDE_CODE_OAUTH_TOKEN` or `ANTHROPIC_API_KEY` is set on this repository, so nothing was able to pick this up. Add one under **Settings → Secrets and variables → Actions** and mention `@claude` again.'
          curl -s -o /dev/null -w 'Comment POST: %{http_code}\n' \
            -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -d "$(jq -nc --arg body "$BODY" '{body:$body}')"
          exit 0

      - name: Report the outcome
        if: always()
        uses: ./.github/actions/report-run
        with:
          agent: mention-router
          trigger: github
          started_at: ${{ steps.start.outputs.started }}
          status: >-
            ${{ steps.route.outcome == 'failure' && 'failed'
            || job.status == 'failure' && 'failed'
            || steps.investigator.outputs.ready != 'true' && 'skipped'
            || 'ok' }}
          summary: >-
            ${{ steps.investigator.outputs.ready == 'true'
            && 'Routed an @claude mention.'
            || 'Skipped: no Claude credential is configured, so the mention went unanswered.' }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
