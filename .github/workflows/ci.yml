name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Workflow scripts are valid
        run: npm run workflows:check

      - name: Icons are up to date
        # The vendored icon module is generated. If someone edits it by hand the
        # next regeneration silently reverts them, so CI catches the drift.
        run: |
          git diff --exit-code --stat lib/icons.generated.ts \
            || { echo "lib/icons.generated.ts has uncommitted changes"; exit 1; }

      - name: Build
        run: npm run build

      # The Next build passing does not mean the thing that actually ships
      # passes. The first real deploy of this project failed on a missing
      # open-next.config.ts that `next build` never looks at, so CI builds the
      # deploy artefact too.
      - name: Build the Worker bundle
        run: npm run cf:build

      # And the bundle assembling does not mean it serves — the same sentence,
      # one step further on. On 2026-08-29 every project page and /finance
      # answered 500 in production while every step above was green. The crash
      # was `format={(v) => …}` handed from a server component to a client one:
      # legal TypeScript, compiles, bundles, and fails only when React tries to
      # serialise the props — which is to say, when something renders the page.
      # The first thing that noticed was Billy clicking a link on the live site.
      #
      # So this boots the Worker and asks it for every route. It seeds a
      # throwaway local D1 first, because against an empty database the pages
      # that crashed return a clean 200: every panel involved sits behind a
      # `rows.length > 0` guard. See the note at the top of db/smoke.sql.
      - name: Every route renders
        run: npm run smoke

      - name: No secrets committed
        # Cheap belt-and-braces: the real protection is .gitignore and
        # `wrangler secret put`, but a pasted key should never reach a branch.
        run: |
          if git grep -nE '(sk_live_|rk_live_|whsec_|ghp_|github_pat_)' -- . ':!*.yml' ':!docs/*'; then
            echo "Possible secret committed — see matches above."
            exit 1
          fi
