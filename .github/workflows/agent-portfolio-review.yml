name: Agent · Portfolio review

# Reads the live dashboard, verifies every finding, and opens one issue with a
# single recommendation. Monday morning, before the project agents run, so the
# week starts with a portfolio-level read rather than four project-level ones.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      period:
        description: 'Period to review'
        required: false
        default: 'last 7 days'

concurrency:
  group: agent-portfolio-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Tell the dashboard a run started
        # A reporting problem must not fail the agent run — losing the log
        # entry is a smaller problem than losing the review. It must also not
        # look like it worked, which is what the old `curl ... || true` got
        # wrong. See .github/actions/report-run.
        uses: ./.github/actions/report-run
        with:
          agent: portfolio-analyst
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          status: running
          started_at: ${{ steps.start.outputs.started }}
          summary: Weekly portfolio review started.
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Is an investigator configured?
        id: investigator
        uses: ./.github/actions/investigator
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Produce the review
        id: review
        if: steps.investigator.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Prefer the Claude subscription token when it is set: on a Max plan
          # these runs cost nothing, where an API key bills per token. The
          # action gives the API key precedence when BOTH are present, so the
          # key is deliberately blanked when a subscription token exists.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /portfolio-review ${{ inputs.period || 'last 7 days' }}

            Then open a GitHub issue titled "Portfolio review — <the period>" whose body
            is the report, labelled `review`.

            Put anything that is going wrong at the top of the body and name it in the
            title. That is the reason this job exists — a review that leads with a
            headline number and buries a stalled project is worse than no review.

            If genuinely nothing changed since the last report in docs/reports/, open no
            issue: commit the report and log one line saying nothing moved.
          claude_args: |
            --allowed-tools Read,Write,Bash,Grep,Glob,WebFetch,Agent,Workflow
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Say why there is no review this week
        if: always() && steps.investigator.outputs.ready != 'true'
        run: |
          echo "::warning title=No portfolio review produced::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, so no review was written and no issue was opened. The week starts with no portfolio-level read."

      - name: Report the outcome
        if: always()
        uses: ./.github/actions/report-run
        with:
          agent: portfolio-analyst
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          started_at: ${{ steps.start.outputs.started }}
          status: >-
            ${{ steps.review.outcome == 'failure' && 'failed'
            || job.status == 'failure' && 'failed'
            || steps.investigator.outputs.ready != 'true' && 'skipped'
            || 'ok' }}
          summary: >-
            ${{ steps.investigator.outputs.ready == 'true'
            && 'Weekly portfolio review.'
            || 'Skipped: no Claude credential is configured, so no review was produced.' }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Commit the report
        if: steps.review.outcome == 'success'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain docs/reports)" ]; then
            git add docs/reports
            git commit -m 'chore(reports): weekly portfolio review'
            git push
          fi
