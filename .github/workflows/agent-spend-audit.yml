name: Agent · Spend audit

# Monthly reconciliation of the ledger against what is actually being paid for.
# Runs on the 1st, after the previous month has closed.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

concurrency:
  group: agent-spend-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Is an investigator configured?
        id: investigator
        uses: ./.github/actions/investigator
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Audit the ledger
        id: audit
        if: steps.investigator.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Prefer the Claude subscription token when it is set: on a Max plan
          # these runs cost nothing, where an API key bills per token. The
          # action gives the API key precedence when BOTH are present, so the
          # key is deliberately blanked when a subscription token exists.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            /spend-audit

            Open a GitHub issue titled "Spend audit — <month>" labelled `finance` listing
            every discrepancy, ranked by which direction it biases ROI — most-flattering
            first. A cost being paid but not recorded is worse than one recorded twice,
            because it makes the business look cheaper to run than it is.

            Include the exact command to fix each one. Do not fix any of them: the ledger
            is a financial record and a human confirms every change.

            If the ledger reconciles cleanly, open no issue.
          claude_args: |
            --allowed-tools Read,Write,Bash,Grep,Glob,WebFetch,Agent
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Say why the ledger was not audited
        if: always() && steps.investigator.outputs.ready != 'true'
        run: |
          echo "::warning title=Ledger not audited::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, so this month's spend was never reconciled against reality. An unrecorded cost makes the business look cheaper to run than it is, and nothing checked for one."

      - name: Report the outcome
        if: always()
        uses: ./.github/actions/report-run
        with:
          agent: spend-auditor
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          started_at: ${{ steps.start.outputs.started }}
          status: >-
            ${{ steps.audit.outcome == 'failure' && 'failed'
            || job.status == 'failure' && 'failed'
            || steps.investigator.outputs.ready != 'true' && 'skipped'
            || 'ok' }}
          summary: >-
            ${{ steps.investigator.outputs.ready == 'true'
            && 'Monthly spend audit.'
            || 'Skipped: no Claude credential is configured, so the ledger was not reconciled.' }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
