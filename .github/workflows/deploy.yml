name: Deploy

# Ships whatever is on main to Cloudflare Workers.
#
# The operator has no terminal, so this is how a change reaches production:
# merge a pull request and the deploy happens. There is also a manual trigger
# for redeploying without a code change — after adding a secret, for example,
# which does not itself restart the Worker.

on:
  push:
    branches: [main]
    # Documentation changes do not need a deploy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      migrate:
        description: 'Apply any new database migrations first?'
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is it set up yet?
        run: |
          if grep -q 'REPLACE_WITH_' wrangler.jsonc; then
            {
              echo "## Not set up yet"
              echo ""
              echo "wrangler.jsonc still has placeholder ids, so there is nothing to deploy to."
              echo ""
              echo "Run the **Set up the dashboard** workflow first (Actions tab → left sidebar)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Catch a broken build before it reaches production rather than after.
      - name: Check
        run: npm run check

      - name: Apply migrations
        if: github.event_name == 'push' || inputs.migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply bba-heartbeat --remote

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Without pipefail the exit status of `cmd | tee` is tee's, so a
          # failed deploy reports success and the run goes green with nothing
          # deployed. That happened on the first real run of this workflow.
          set -o pipefail
          npm run cf:deploy 2>&1 | tee deploy.log
          URL=$(grep -oiE 'https://[a-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "Deploy finished but printed no workers.dev URL."
            echo "Find it at Cloudflare -> Workers & Pages -> bba-heartbeat."
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -n "$URL" ]; then
            echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$URL**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deploy did not complete" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See the log above for what failed." >> "$GITHUB_STEP_SUMMARY"
          fi
