name: Agent · Pipeline nudge

# Weekday check on the client pipeline: actions due, relationships going cold.
# 08:00 UTC so it lands before the working day rather than during it.
on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: agent-pipeline-nudge
  cancel-in-progress: true

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: start
        run: echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Is an investigator configured?
        id: investigator
        uses: ./.github/actions/investigator
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check the pipeline
        id: nudge
        # Without this gate the action fails on a missing credential and takes
        # the job red, which is indistinguishable from the pipeline check
        # itself having gone wrong.
        if: steps.investigator.outputs.ready == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Prefer the Claude subscription token when it is set: on a Max plan
          # these runs cost nothing, where an API key bills per token. The
          # action gives the API key precedence when BOTH are present, so the
          # key is deliberately blanked when a subscription token exists.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Use the `pipeline-nudge` subagent.

            Open one issue labelled `pipeline` ONLY if there is something to act on.
            An empty issue every weekday trains everyone to ignore the label, which
            costs more than the occasional missed follow-up.

            Never contact anybody and never edit a client record — propose, with the
            API call, and stop.
          claude_args: |
            --allowed-tools Read,Write,Bash,Grep,Glob,WebFetch,Agent
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

      - name: Say why nothing checked the pipeline
        if: always() && steps.investigator.outputs.ready != 'true'
        run: |
          echo "::warning title=Pipeline not checked::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY is set, so nothing read the pipeline today and no issue was opened. Actions that are due are still due — nobody has looked."

      - name: Report the outcome
        if: always()
        uses: ./.github/actions/report-run
        with:
          agent: pipeline-nudge
          trigger: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
          started_at: ${{ steps.start.outputs.started }}
          status: >-
            ${{ steps.nudge.outcome == 'failure' && 'failed'
            || steps.investigator.outputs.ready != 'true' && 'skipped'
            || 'ok' }}
          summary: >-
            ${{ steps.investigator.outputs.ready == 'true'
            && 'Weekday pipeline check.'
            || 'Skipped: no Claude credential is configured, so nothing read the pipeline.' }}
          artifact_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          dashboard_url: ${{ secrets.DASHBOARD_URL }}
          dashboard_token: ${{ secrets.DASHBOARD_TOKEN }}
          access_client_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access_client_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
