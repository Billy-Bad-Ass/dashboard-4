name: Ops · Give the other repos the credentials they report with

# Four values live in this repository and nowhere else:
#
#   DASHBOARD_URL            where the console is
#   DASHBOARD_TOKEN          what /api/agent-runs checks
#   CF_ACCESS_CLIENT_ID      the Access service token Cloudflare checks first
#   CF_ACCESS_CLIENT_SECRET  its secret
#
# Every agent outside this repository needs all four to report a run, and none
# of them has any. That is why the console shows six agents as never having
# said a word: not because they are broken, but because they have no way to
# speak. DASHBOARD_TOKEN in particular was rotated on 2026-08-26 and the new
# value exists in exactly two places, this repository and the bba-heartbeat
# Worker, so nothing else could match it even by accident.
#
# A repository secret is readable inside that repository's own workflows. That
# is the whole mechanism here — this job reads its own four secrets and writes
# them somewhere else. Nothing is printed, and every value is masked before it
# is used.
#
# Targets:
#
#   Billy-Bad-Ass/network-store-2   repository secrets   4 agents
#   Billy-Bad-Ass/sitecheck-1       repository secrets   1 agent
#   Billy-Bad-Ass/web-6             repository secrets   redirect-guard
#   Worker bba-network-hub          Worker secrets       link-warden
#
# web-6 takes both. Its two checks run in two places, and that is not an
# accident of history: redirect-guard probes the apex, and a Worker cannot
# fetch the hostname it serves — Cloudflare answers 522 — so that one runs on
# a GitHub runner and needs repository secrets. link-warden probes other
# people's hostnames and stays on the Worker.
#
# The Worker is not a GitHub repository and takes them a different way, through
# `wrangler secret put`. src/report.ts in web-6 already reads all four and
# already handles the Access headers correctly; it has simply never had a value
# to read.
#
# Safe to re-run. Writing a secret that is already correct changes nothing.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Type APPLY to write. Anything else lists what would be written and stops.'
        required: false
        default: ''

concurrency:
  group: ops-distribute-agent-credentials
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Which of them exist, by name only. A length and a presence flag are not
      # secret; a value is. This runs on a dry run too, because "which of these
      # four is missing" is the single most useful thing this job can say.
      - name: Say which values are available to distribute
        id: have
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CSEC: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          CF_OPS_TOKEN: ${{ secrets.CF_OPS_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in DASHBOARD_URL DASHBOARD_TOKEN CID CSEC; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Nothing to distribute::These are not set in this repository, so there is no value to copy anywhere:$missing"
            exit 1
          fi
          echo "All four reporting values are set here."
          echo "Access client id: ${#CID} chars, secret: ${#CSEC} chars (expected 39 and 64)."

          if [ -z "$GH_SECRETS_TOKEN" ]; then
            echo "::error title=No GitHub token::GH_SECRETS_TOKEN is not set, so this job cannot write a secret to another repository. It needs a fine-grained PAT with 'Secrets: Read and write' on network-store-2, sitecheck-1 and web-6."
            exit 1
          fi

          # The Claude credential is a separate question and a separate answer.
          # Without it every model-driven agent in the portfolio is dead, here
          # included — but there is nothing to copy if this repository has not
          # got one either, and inventing one is not on the table.
          if [ -n "$OAUTH" ]; then
            echo "claude=oauth" >> "$GITHUB_OUTPUT"
            echo "CLAUDE_CODE_OAUTH_TOKEN is set here and will be copied too."
          elif [ -n "$APIKEY" ]; then
            echo "claude=apikey" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is set here and will be copied too."
          else
            echo "claude=none" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Claude credential to copy::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set in this repository either, so nothing can be copied to the others. Until one exists, every model-driven agent in the portfolio stays skipped — portfolio-analyst and spend-auditor here, and market-researcher, revenue-analyst, listing-copywriter and release-qa in network-store-2. Run 'claude setup-token' and store the result here as CLAUDE_CODE_OAUTH_TOKEN; then re-run this job to fan it out."
          fi

          if [ -z "$CF_OPS_TOKEN" ]; then
            echo "worker=skip" >> "$GITHUB_OUTPUT"
            echo "::warning title=Worker will be skipped::CF_OPS_TOKEN is not set, so the bba-network-hub Worker cannot be given its secrets and link-warden and redirect-guard stay silent."
          else
            echo "worker=go" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop here unless APPLY was typed
        if: ${{ github.event.inputs.apply != 'APPLY' }}
        run: |
          echo "::notice title=Nothing written::Dry run. Re-run with apply=APPLY to write these secrets to network-store-2, sitecheck-1 and the bba-network-hub Worker."
          exit 1

      - name: Write the repository secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CSEC: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_KIND: ${{ steps.have.outputs.claude }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DASHBOARD_TOKEN"
          echo "::add-mask::$CID"
          echo "::add-mask::$CSEC"
          [ -n "$OAUTH" ] && echo "::add-mask::$OAUTH" || true
          [ -n "$APIKEY" ] && echo "::add-mask::$APIKEY" || true

          # printf, not echo: a trailing newline inside a bearer token produces
          # a 401 that is indistinguishable from a wrong token.
          put() {
            printf '%s' "$3" | gh secret set "$2" --repo "$1"
            echo "  $1: $2 written."
          }

          failed=""
          for repo in Billy-Bad-Ass/network-store-2 Billy-Bad-Ass/sitecheck-1 Billy-Bad-Ass/web-6; do
            echo "$repo"
            if ! gh secret list --repo "$repo" >/dev/null 2>&1; then
              echo "::error title=No access to $repo::GH_SECRETS_TOKEN cannot read this repository's secrets, so it cannot write them. Grant it 'Secrets: Read and write' on $repo."
              failed="$failed $repo"
              continue
            fi
            put "$repo" DASHBOARD_URL           "$DASHBOARD_URL"
            put "$repo" DASHBOARD_TOKEN         "$DASHBOARD_TOKEN"
            put "$repo" CF_ACCESS_CLIENT_ID     "$CID"
            put "$repo" CF_ACCESS_CLIENT_SECRET "$CSEC"
            # web-6's checks are deterministic probes — fetch, compare,
            # report. No model is in the loop, so it gets no model credential.
            if [ "$repo" != "Billy-Bad-Ass/web-6" ]; then
              case "$CLAUDE_KIND" in
                oauth)  put "$repo" CLAUDE_CODE_OAUTH_TOKEN "$OAUTH" ;;
                apikey) put "$repo" ANTHROPIC_API_KEY       "$APIKEY" ;;
              esac
            fi
          done

          if [ -n "$failed" ]; then
            echo "::error title=Some repositories were not written::$failed"
            exit 1
          fi

      # Names and timestamps, never values. This is the proof the writes landed,
      # and it is the only proof available: a secret cannot be read back.
      - name: Show what each repository now holds
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          for repo in Billy-Bad-Ass/network-store-2 Billy-Bad-Ass/sitecheck-1 Billy-Bad-Ass/web-6; do
            echo "== $repo"
            gh secret list --repo "$repo"
          done

      - name: Give the bba-network-hub Worker the same four values
        if: steps.have.outputs.worker == 'go'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_OPS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
          CID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CSEC: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "::add-mask::$DASHBOARD_TOKEN"
          echo "::add-mask::$CID"
          echo "::add-mask::$CSEC"

          # web-6's src/report.ts reads all four off `env`. DASHBOARD_URL is not
          # secret, but it goes in as a secret anyway: a plain var would have to
          # be declared in that repository's wrangler.jsonc, and a deploy from
          # there would then be the thing that decides whether reporting works.
          for pair in "DASHBOARD_URL=$DASHBOARD_URL" \
                      "DASHBOARD_TOKEN=$DASHBOARD_TOKEN" \
                      "CF_ACCESS_CLIENT_ID=$CID" \
                      "CF_ACCESS_CLIENT_SECRET=$CSEC"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            printf '%s' "$value" | npx --yes wrangler@3 secret put "$name" --name bba-network-hub
            echo "  bba-network-hub: $name written."
          done

          echo "== bba-network-hub now holds"
          npx --yes wrangler@3 secret list --name bba-network-hub

      # The real path, end to end, from a repository that is not this one.
      #
      # A green `gh secret set` proves a value was stored, not that it works.
      # This dispatches network-store-2's revenue digest, which now posts
      # through Cloudflare Access to /api/agent-runs like every other agent.
      # With no Claude credential it will report `skipped` — and a `skipped`
      # that arrives is a complete proof of the reporting chain, which is what
      # this job is actually responsible for.
      # redirect-guard is the one agent in the fleet that runs on a runner in
      # a repository other than this one, so its credentials are the ones with
      # no other way of being checked. Dispatching it is the only proof.
      - name: Prove web-6's runner-side check can now reach the console
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if ! out=$(gh workflow run agent-redirect-guard.yml \
                 --repo Billy-Bad-Ass/web-6 --ref main 2>&1); then
            echo "$out"
            echo "::warning title=Could not dispatch redirect-guard::The secrets this job wrote to web-6 are stored but unproven. Likely GH_SECRETS_TOKEN has no 'Actions: write' there, or agent-redirect-guard.yml is not yet on web-6's main branch. Start 'Agent · Redirect guard' by hand and check that it reports."
            exit 0
          fi
          echo "::notice title=Dispatched::Started 'Agent · Redirect guard' in web-6. It probes the apex from a runner, which is the only place it can be probed from."

      - name: Prove another repository can now reach the console
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if ! out=$(gh workflow run agent-revenue-digest.yml \
                 --repo Billy-Bad-Ass/network-store-2 --ref main 2>&1); then
            echo "$out"
            echo "::warning title=Could not dispatch::Nothing was started in network-store-2, so the secrets this job just wrote are stored but unproven. Two likely reasons, and the message above says which: GH_SECRETS_TOKEN has no 'Actions: write' there, or agent-revenue-digest.yml is not yet on that repository's main branch. Either way, start 'Agent · Revenue digest' by hand and check its 'Report the outcome' step."
            exit 0
          fi
          echo "::notice title=Dispatched::Started 'Agent · Revenue digest' in network-store-2. Its 'Report the outcome' step is the proof: a 2xx means the four values landed and Access accepted them."

      # The same question for the Worker half, which has no runner and no
      # Actions page — the only two agents in the fleet that run outside
      # GitHub. web-6 gained `POST /__run/<check>` for exactly this: a
      # Cloudflare cron cannot be made to fire on demand, so without it these
      # four secrets could not be shown to work until 07:20 UTC tomorrow.
      #
      # It runs the real check and the real reportRun, and answers with
      # reportRun's own sentence.
      - name: Prove the bba-network-hub Worker can now reach the console
        if: steps.have.outputs.worker == 'go'
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          # link-warden only, because it is the only check that runs on the
          # Worker now. redirect-guard moved to a GitHub runner on 2026-08-26:
          # it probes the apex, and a Worker cannot fetch the hostname it
          # serves. Asking this endpoint to run it answers 409 and says so.
          # Its proof is the step below.
          for CHECK in link-warden; do
            CODE=$(curl -s -o /tmp/hub -w '%{http_code}' --max-time 45 \
              -X POST "https://bbanetwork.org/__run/$CHECK" \
              -H "authorization: Bearer $DASHBOARD_TOKEN")
            BODY=$(head -c 300 /tmp/hub)
            echo "POST /__run/$CHECK -> $CODE"
            echo "$BODY"
            case "$CODE" in
              200)
                case "$BODY" in
                  *"reported ("*) echo "::notice title=$CHECK reports::It ran and the console recorded it." ;;
                  *) echo "::warning title=$CHECK ran but did not report::The check itself completed. The rest of that line is reportRun saying why the console did not take it." ;;
                esac
                ;;
              404)
                echo "::warning title=Endpoint not live yet::A 404 here means either that the Worker has not finished deploying the commit that added POST /__run/, or that its DASHBOARD_TOKEN does not match the one this job holds — the endpoint answers 404 to a wrong token on purpose, so the two look the same from outside. Re-run this job in a few minutes; if it stays 404, the token is the answer."
                ;;
              *)
                echo "::warning title=Unexpected::$CODE from bbanetwork.org/__run/$CHECK."
                ;;
            esac
          done
