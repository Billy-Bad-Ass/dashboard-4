name: Set up the dashboard

# The whole first-time setup, as a button.
#
# This exists because the operator works from an iPad and has no terminal. Every
# step that `npm run setup` does locally — create the D1 database, the KV
# namespace and the R2 bucket, write their ids into wrangler.jsonc, apply the
# migrations, deploy — happens here instead, on a GitHub runner.
#
# To run it: Actions tab -> "Set up the dashboard" -> Run workflow.
#
# Needs two repository secrets first (Settings -> Secrets and variables ->
# Actions):
#   CLOUDFLARE_API_TOKEN   an "Edit Cloudflare Workers" token, plus D1:Edit
#   CLOUDFLARE_ACCOUNT_ID  the hex string from your Cloudflare dashboard URL
#
# Safe to re-run. Everything below tolerates the resource already existing,
# because that is the normal state on a second attempt.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after setting up?'
        type: boolean
        default: true
      seed:
        description: 'Insert the starting spend row (the Cloudflare subscription)?'
        type: boolean
        default: true

concurrency:
  group: setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A token that can push, so the workflow can commit the resource ids
          # back into wrangler.jsonc.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the credentials are there
        run: |
          MISSING=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            {
              echo "## Missing secrets"
              echo ""
              echo "Add these under **Settings → Secrets and variables → Actions**, then run this again:"
              echo ""
              for name in $MISSING; do echo "- \`$name\`"; done
              echo ""
              echo "Get the token from Cloudflare → your icon (top right) → API Tokens →"
              echo "Create Token → **Edit Cloudflare Workers** template, then add **D1: Edit**"
              echo "to its permissions before saving."
              echo ""
              echo "The account id is the hex string in your Cloudflare dashboard URL."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$MISSING"
            exit 1
          fi

      - name: Create the storage
        id: storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision.mjs

      - name: Commit the resource ids
        run: |
          if [ -n "$(git status --porcelain wrangler.jsonc)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add wrangler.jsonc
            git commit -m 'chore: wire up the Cloudflare resource ids'
            git push
            echo "Committed the ids into wrangler.jsonc."
          else
            echo "wrangler.jsonc already had the ids."
          fi

      - name: Apply the database schema
        if: steps.storage.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply bba-heartbeat --remote

      - name: Insert the starting spend row
        if: steps.storage.outputs.ready == 'true' && inputs.seed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute bba-heartbeat --remote --file=db/seed.sql

      - name: Deploy
        id: deploy
        if: steps.storage.outputs.ready == 'true' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run cf:deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: What to do next
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          {
            echo "## Dashboard setup"
            echo ""
            if [ -n "$URL" ]; then
              echo "### It is live"
              echo ""
              echo "**$URL**"
              echo ""
              echo "Open it. Most things will say \"not connected\" until you finish below."
            else
              echo "Storage is set up. Deploy did not run or did not report a URL —"
              echo "check the log above."
            fi
            echo ""
            echo "### Three things left, all in a browser"
            echo ""
            echo "**1. Add your keys.** Cloudflare → Workers & Pages → \`bba-heartbeat\` →"
            echo "Settings → Variables and Secrets → Add. One at a time, type **Secret**:"
            echo ""
            echo "| Name | What it turns on |"
            echo "| --- | --- |"
            echo "| \`DASHBOARD_TOKEN\` | Guards the write endpoints. Any long random string. |"
            echo "| \`STRIPE_SECRET_KEY\` | Revenue. Restricted key, read scopes only. |"
            echo "| \`CALENDAR_ICS_URL\` | Your calendar. The secret iCal address. |"
            echo "| \`CLOUDFLARE_API_TOKEN\` | Traffic stats. Same token you used here. |"
            echo "| \`CLOUDFLARE_ACCOUNT_ID\` | Same account id you used here. |"
            echo "| \`ANTHROPIC_API_KEY\` | The Ask page. Needs API credits — see docs/IPAD.md. |"
            echo ""
            echo "Every one is optional. The dashboard runs without them and \`/setup\`"
            echo "shows what is missing."
            echo ""
            echo "**2. Lock it down.** Until you do, anyone with the URL can read your"
            echo "finances. Cloudflare → Zero Trust → Access → Applications →"
            echo "Add an application → Self-hosted → point it at the URL above →"
            echo "policy: Emails → your address. Free, on the plan you already pay for."
            echo ""
            echo "**3. Switch the agents on.** In this repo: Settings → Secrets and"
            echo "variables → Actions. Add \`DASHBOARD_URL\` (the URL above) and"
            echo "\`DASHBOARD_TOKEN\` (the same value you set in step 1)."
            echo ""
            echo "Full detail: [docs/IPAD.md](../blob/main/docs/IPAD.md)"
          } >> "$GITHUB_STEP_SUMMARY"
